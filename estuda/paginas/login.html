<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Estuda</title>
  <link rel="stylesheet" href="../css/estilo.css">
  <script src="../js/dados.js" defer></script>
  <script src="../js/login.js" defer></script>
</head>
<body class="pagina-login">
  <header class="topo"><div class="container barra">
    <a class="marca" href="../index.html"><span aria-hidden="true">✳</span> estuda.</a>
    <a href="../index.html">← Início</a>
  </div></header>
  <main class="container layout-login">
    <aside class="chamada-login"><span aria-hidden="true">✳</span><p>O próximo passo é seu.</p></aside>
    <section class="formulario" aria-labelledby="titulo">
      <p class="rotulo">Área do estudante</p>
      <h1 id="titulo">Boas-vindas.</h1>
      <p>Entre com os dados de demonstração para abrir seu painel.</p>
      <form id="login">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username" placeholder="estudante@exemplo.com" required>
        <label for="senha">Senha</label>
        <div class="campo-senha">
          <input id="senha" type="password" autocomplete="current-password" required>
          <button id="alternar" type="button" aria-controls="senha" aria-pressed="false">Mostrar senha</button>
        </div>
        <p id="erro" class="erro" role="alert"></p>
        <button class="botao" type="submit">Entrar no painel <span aria-hidden="true">→</span></button>
        <button id="preencher" class="botao contorno" type="button">Preencher dados da demo</button>
      </form>
      <p class="nota">Login simulado no navegador. Use apenas os dados de demonstração.</p>
      <noscript><p>Ative o JavaScript para acessar a demonstração.</p></noscript>
    </section>
  </main>
</body>
</html>
